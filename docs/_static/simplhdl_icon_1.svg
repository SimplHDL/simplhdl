<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <style>
    .si-stroke { stroke: #0284C7; }
    .mpl-stroke { stroke: #4F46E5; }
    @media (prefers-color-scheme: dark) {
      .si-stroke { stroke: #22D3EE; }
      .mpl-stroke { stroke: #818CF8; }
    }
    [data-md-color-scheme="slate"] .si-stroke { stroke: #22D3EE; }
    [data-md-color-scheme="slate"] .mpl-stroke { stroke: #818CF8; }
    [data-md-color-scheme="default"] .si-stroke { stroke: #0284C7; }
    [data-md-color-scheme="default"] .mpl-stroke { stroke: #4F46E5; }
  </style>
  <!-- Top Ribbon (SI - Simulation) -->
  <path class="si-stroke"
        d="M 196 52
           H 92
           C 56 52, 36 74, 36 104
           C 36 134, 56 148, 100 148
           H 148"
        stroke-width="32"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  <!-- Bottom Ribbon (IMPL - Implementation) -->
  <path class="mpl-stroke"
        d="M 108 108
           H 156
           C 200 108, 220 122, 220 152
           C 220 182, 200 204, 164 204
           H 60"
        stroke-width="32"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
